<!-- Header / Navbar -->
<header class="bg-stone-900 text-amber-500 shadow-md py-3 px-6 flex flex-wrap justify-between items-center z-20 border-b border-amber-600/30">
    <div class="flex items-center space-x-3 space-x-reverse">
        <span class="text-2xl font-bold tracking-wider">أطلس الآثار المصرية القديمة</span>
        <span class="text-xs bg-amber-600/20 text-amber-400 px-2.5 py-1 rounded-full border border-amber-600/40">عصر الدولة القديمة</span>
    </div>
    
    <!-- Dynasty Filter Buttons -->
    <div class="flex flex-wrap gap-2 my-2 sm:my-0">
        <button onclick="filterDynasty(3)" id="btn-dyn-3" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition bg-stone-800 text-amber-400 hover:bg-amber-600 hover:text-white border border-stone-700">الأسرة الثالثة</button>
        <button onclick="filterDynasty(4)" id="btn-dyn-4" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition bg-amber-600 text-white shadow-md border border-amber-500">الأسرة الرابعة</button>
        <button onclick="filterDynasty(5)" id="btn-dyn-5" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition bg-stone-800 text-amber-400 hover:bg-amber-600 hover:text-white border border-stone-700">الأسرة الخامسة</button>
        <button onclick="filterDynasty(6)" id="btn-dyn-6" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition bg-stone-800 text-amber-400 hover:bg-amber-600 hover:text-white border border-stone-700">الأسرة السادسة</button>
        <button onclick="filterDynasty('all')" id="btn-dyn-all" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition bg-stone-800 text-stone-300 hover:bg-stone-700 border border-stone-700">الكل</button>
    </div>
</header>

<!-- Main Container -->
<div class="flex flex-1 relative overflow-hidden">
    
    <!-- Sidebar for Monuments List -->
    <aside class="w-80 bg-white shadow-xl z-10 flex flex-col border-l border-gray-200">
        <div class="p-4 bg-stone-800 text-amber-400 font-bold border-b flex justify-between items-center">
            <span id="sidebar-title">معالم الأسرة الرابعة</span>
            <span id="item-count" class="text-xs bg-stone-700 px-2 py-1 rounded text-stone-200">0 موقع</span>
        </div>
        <div class="p-3 bg-gray-50 border-b">
            <input type="text" id="search-input" placeholder="ابحث عن أثر أو معلم..." class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" oninput="searchMonuments()">
        </div>
        <div id="monuments-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
            <!-- Dynamic List Items -->
        </div>
    </aside>

    <!-- Map Area -->
    <main class="flex-1 relative">
        <div id="map"></div>
    </main>
</div>

    let markers = [];

    // Render Map Markers & Sidebar List
    function renderMap(dynasty = 4) {
        // Clear existing markers
        markers.forEach(m => map.removeLayer(m.marker));
        markers = [];

        const listContainer = document.getElementById('monuments-list');
        listContainer.innerHTML = '';

        const filteredData = monumentsData.filter(item => dynasty === 'all' || item.dynasty === dynasty);
        
        document.getElementById('item-count').innerText = filteredData.length + ' موقع';
        document.getElementById('sidebar-title').innerText = dynasty === 'all' ? 'جميع معالم الدولة القديمة' : `معالم الأسرة الرابعة`;

        if (filteredData.length === 0) {
            listContainer.innerHTML = '<div class="p-4 text-center text-gray-500">لا توجد بيانات مطابقة</div>';
            return;
        }

        filteredData.forEach(item => {
            // Create custom marker color based on type
            let markerColor = '#d97706'; // default amber
            if(item.type === 'هرم') markerColor = '#b45309';
            else if(item.type === 'معبد') markerColor = '#b91c1c';
            else if(item.type === 'محجر' || item.type === 'منجم') markerColor = '#4b5563';
            else if(item.type === 'تمثال') markerColor = '#1e40af';

            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color:${markerColor}; width:14px; height:14px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            const marker = L.marker([item.y, item.x], { icon: customIcon }).addTo(map);

            marker.bindPopup(`
                <div style="padding: 10px; max-width: 220px; font-family: 'Cairo', sans-serif;">
                    <span style="font-size: 10px; background: #fef3c7; color: #b45309; padding: 2px 6px; border-radius: 4px; font-weight: 600;">الأسرة ${item.dynasty} - ${item.type}</span>
                    <h3 style="font-weight: 700; font-size: 14px; margin: 6px 0 4px 0; color: #1c1917;">${item.name}</h3>
                    ${item.king ? `<p style="font-size: 11px; color: #78716c; margin-bottom: 4px;"><strong>الملك/المرتبط:</strong> \${item.king}</p>` : ''}
                    <p style="font-size: 11px; color: #44403c; line-height: 1.4;">${item.desc}</p>
                </div>
            `, { className: 'custom-popup' });

            markers.push({ id: item.id, marker: marker, data: item });

            // Add item to sidebar list
            const card = document.createElement('div');
            card.className = "p-3 hover:bg-amber-50 cursor-pointer transition border-b border-gray-100";
            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <h4 class="text-xs font-bold text-stone-800">${item.name}</h4>
                    <span class="text-[10px] bg-stone-100 text-stone-600 px-1.5 py-0.5 rounded">${item.type}</span>
                </div>
                <p class="text-[11px] text-gray-500 mt-1 line-clamp-1">${item.desc}</p>
            `;
            card.onclick = () => {
                map.setView([item.y, item.x], 14);
                marker.openPopup();
            };
            listContainer.appendChild(card);
        });
    }

    // Filter Function for Dynasties
    function filterDynasty(dynasty) {
        currentDynastyFilter = dynasty;
        
        // Update button styles
        [3, 4, 5, 6, 'all'].forEach(d => {
            const btn = document.getElementById(`btn-dyn-${d}`);
            if (btn) {
                if (d === dynasty) {
                    btn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold transition bg-amber-600 text-white shadow-md border border-amber-500";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold transition bg-stone-800 text-amber-400 hover:bg-amber-600 hover:text-white border border-stone-700";
                }
            }
        });

        renderMap(dynasty);
    }

    // Search Function
    function searchMonuments() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = monumentsData.filter(item => 
            (currentDynastyFilter === 'all' || item.dynasty === currentDynastyFilter) &&
            (item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || (item.king && item.king.toLowerCase().includes(query)))
        );

        // Re-render sidebar and map markers
        markers.forEach(m => {
            if (filtered.some(f => f.id === m.id)) {
                m.marker.addTo(map);
            } else {
                map.removeLayer(m.marker);
            }
        });

        const listContainer = document.getElementById('monuments-list');
        listContainer.innerHTML = '';
        document.getElementById('item-count').innerText = filtered.length + ' موقع';

        filtered.forEach(item => {
            const markerObj = markers.find(m => m.id === item.id);
            const card = document.createElement('div');
            card.className = "p-3 hover:bg-amber-50 cursor-pointer transition border-b border-gray-100";
            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <h4 class="text-xs font-bold text-stone-800">${item.name}</h4>
                    <span class="text-[10px] bg-stone-100 text-stone-600 px-1.5 py-0.5 rounded">${item.type}</span>
                </div>
                <p class="text-[11px] text-gray-500 mt-1 line-clamp-1">${item.desc}</p>
            `;
            if(markerObj) {
                card.onclick = () => {
                    map.setView([item.y, item.x], 14);
                    markerObj.marker.openPopup();
                };
            }
            listContainer.appendChild(card);
        });
    }

    // Initial Load: Dynasty 4
    renderMap(4);
</script>
